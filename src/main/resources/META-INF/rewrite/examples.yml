---
type: specs.openrewrite.org/v1beta/example
recipeName: org.openrewrite.java.pmd.AddPmdRule
examples:
- description: '`AddPmdRuleTest#addRuleReference`'
  parameters:
  - category/java/errorprone.xml/EmptyCatchBlock
  sources:
  - before: |
      <?xml version="1.0"?>
      <ruleset name="custom">
          <rule ref="category/java/errorprone.xml/AvoidBranchingStatementAsLastInLoop"/>
      </ruleset>
    after: |
      <?xml version="1.0"?>
      <ruleset name="custom">
          <rule ref="category/java/errorprone.xml/AvoidBranchingStatementAsLastInLoop"/>
          <rule ref="category/java/errorprone.xml/EmptyCatchBlock"/>
      </ruleset>
    language: xml
---
type: specs.openrewrite.org/v1beta/example
recipeName: org.openrewrite.java.pmd.ModernizePmd
examples:
- description: '`ModernizePmdTest#modernizeRulesetWrittenForPmd6`'
  sources:
  - before: |
      <?xml version="1.0"?>
      <ruleset name="custom"
               xmlns="http://pmd.sourceforge.net/ruleset/2.0.0">
          <description>Our rules</description>
          <rule ref="category/java/bestpractices.xml/UnusedImports"/>
          <rule ref="category/java/bestpractices.xml/JUnitTestsShouldIncludeAssert"/>
          <rule ref="category/java/design.xml/NcssTypeCount"/>
          <rule ref="category/java/design.xml/UseUtilityClass"/>
          <rule ref="category/java/errorprone.xml/CloneThrowsCloneNotSupportedException"/>
          <rule ref="category/java/bestpractices.xml/AvoidReassigningParameters"/>
      </ruleset>
    after: |
      <?xml version="1.0"?>
      <ruleset name="custom"
               xmlns="http://pmd.sourceforge.net/ruleset/2.0.0">
          <description>Our rules</description>
          <rule ref="category/java/codestyle.xml/UnnecessaryImport"/>
          <rule ref="category/java/bestpractices.xml/UnitTestShouldIncludeAssert"/>
          <rule ref="category/java/design.xml/NcssCount"/>
          <rule ref="category/java/design.xml/InstantiableUtilityClass"/>
          <rule ref="category/java/bestpractices.xml/AvoidReassigningParameters"/>
      </ruleset>
    language: xml
---
type: specs.openrewrite.org/v1beta/example
recipeName: org.openrewrite.java.pmd.Pmd6to7Migration
examples:
- description: '`Pmd6to7MigrationTest#migrateRuleset`'
  sources:
  - before: |
      <?xml version="1.0"?>
      <ruleset name="custom"
               xmlns="http://pmd.sourceforge.net/ruleset/2.0.0">
          <description>Our rules</description>
          <rule ref="category/java/bestpractices.xml/UnusedImports"/>
          <rule ref="category/java/errorprone.xml/MissingBreakInSwitch"/>
          <rule ref="category/java/design.xml/StdCyclomaticComplexity"/>
          <rule ref="category/java/performance.xml/AvoidUsingShortType"/>
          <rule ref="category/java/bestpractices.xml/AvoidReassigningParameters"/>
      </ruleset>
    after: |
      <?xml version="1.0"?>
      <ruleset name="custom"
               xmlns="http://pmd.sourceforge.net/ruleset/2.0.0">
          <description>Our rules</description>
          <rule ref="category/java/codestyle.xml/UnnecessaryImport"/>
          <rule ref="category/java/errorprone.xml/ImplicitSwitchFallThrough"/>
          <rule ref="category/java/design.xml/CyclomaticComplexity"/>
          <rule ref="category/java/bestpractices.xml/AvoidReassigningParameters"/>
      </ruleset>
    language: xml
